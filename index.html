<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在前往門診預約表單...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1DB446;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>正在載入預約表單，請稍候...</p>

  <script>
    const MY_LIFF_ID = "2011971800-0HrnjFQO"; 

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          const userId = profile.userId;
          
          const targetFormUrl = `https://docs.google.com/forms/d/e/1FAIpQLSe-0j4Qfy9GVkrHGbAYK0jfM1nyqDOm-L6AAdY96lxG1XtckQ/viewform?usp=pp_url&entry.229588879=${userId}`;
          
          window.location.href = targetFormUrl;
        }
      } catch (err) {
        console.error("LIFF 初始化失敗：", err);
        window.location.href = "https://forms.gle/e5GAK4mUbihYkXoA8";
      }
    }

    main();
  </script>
</body>
</html>
